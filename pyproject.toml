[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nanopick"
version = "0.1.0"
description = "Find your files by saying what you remember — words, a kind, roughly when. Open them, copy them, pack them. Nothing is ever moved."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Priyanshu Agarwal" }]
keywords = ["file-search", "beginners", "local-first", "offline", "files", "drag-and-drop"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Desktop Environment :: File Managers",
]
dependencies = []

[project.scripts]
nanopick = "nanopick.__main__:main"

[project.urls]
Homepage = "https://github.com/Agarwalrishu13/nanopick"

[tool.setuptools]
packages = ["nanopick"]
include-package-data = true

[tool.setuptools.package-data]
nanopick = ["web/*"]
